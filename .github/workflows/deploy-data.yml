name: Deploy Data

# 数据/图片/视频变更（public/）触发快速部署：直接拷贝静态文件，无需构建
# admin 后台发布数据后，约 1 分钟内全网上线
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-data.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy static data
        run: |
          mkdir -p dist
          cp -r public/* dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
