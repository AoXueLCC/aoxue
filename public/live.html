<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F5F7FA" />
<title>奥雪致行 · 每日车型展示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230066FF'/%3E%3C/svg%3E" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #F7F9FC 0%, #EEF2F8 100%);
    color: #1D2129;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: clamp(14px, 2.4vh, 28px) clamp(20px, 4vw, 48px) 0;
  }
  .topbar-title {
    font-size: clamp(14px, 1.6vw + 0.4vh, 22px);
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 0.6em;
    white-space: nowrap;
  }
  .topbar-title::before {
    content: '';
    width: 0.5em; height: 0.5em;
    border-radius: 50%;
    background: #0066FF;
  }
  .topbar-date {
    font-size: clamp(12px, 1.3vw + 0.3vh, 18px);
    color: #86909C;
    white-space: nowrap;
    flex: none;
    margin-left: 12px;
  }
  .date-short { display: none; }
  @media (max-width: 520px) {
    .date-full { display: none; }
    .date-short { display: inline; }
  }
  .stage { flex: 1; position: relative; overflow: hidden; }
  .slide {
    position: absolute; inset: 0;
    display: flex;
    padding: clamp(10px, 2vh, 28px) clamp(16px, 3.5vw, 44px) clamp(14px, 2.6vh, 36px);
    opacity: 0;
    transform: translateY(26px) scale(0.985);
    transition: opacity .65s ease, transform .65s cubic-bezier(.22, .8, .3, 1);
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: none; pointer-events: auto; }
  .card {
    flex: 1;
    min-width: 0; min-height: 0;
    position: relative;
    background: #fff;
    border-radius: clamp(16px, 2.2vw, 28px);
    box-shadow: 0 6px 32px rgba(29, 33, 41, .07), 0 1px 3px rgba(29, 33, 41, .04);
    display: flex;
    flex-direction: column;
    padding: clamp(18px, 3vh, 40px) clamp(20px, 4.5vw, 64px);
    gap: clamp(12px, 2vh, 28px);
  }
  .media {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .media img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: clamp(8px, 1.2vw, 16px);
  }
  .pause-hint {
    position: absolute;
    top: clamp(12px, 2vh, 24px);
    left: clamp(12px, 2vw, 28px);
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    background: rgba(29, 33, 41, .78);
    color: #fff;
    font-size: clamp(13px, 1.6vw + 0.5vh, 24px);
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 0.55em 1.1em;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 2;
  }
  .pause-hint svg { width: 1em; height: 1em; fill: currentColor; }
  body.paused .pause-hint { opacity: 1; }
  body.paused .progress-fill { animation-play-state: paused; }
  .info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.8vh, 22px);
    text-align: center;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.2vw, 16px);
  }
  .brand-logo { height: clamp(30px, 5.6vw + 0.9vh, 66px); width: auto; }
  .brand-name {
    font-size: clamp(17px, 2.4vw + 0.8vh, 34px);
    font-weight: 500;
    color: #4E5969;
    letter-spacing: 1px;
  }
  .model {
    font-size: clamp(30px, 6.6vw + 1.2vh, 80px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 1px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.2vw, 18px);
  }
  .energy, .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    font-size: clamp(16px, 2.3vw + 0.7vh, 32px);
    font-weight: 600;
    padding: clamp(7px, 1vh, 14px) clamp(18px, 2.3vw, 36px);
    border-radius: 999px;
  }
  .chip { background: #F2F3F5; color: #4E5969; }
  .energy svg { width: 1em; height: 1em; fill: currentColor; }
  .energy-ev { background: #EBF2FF; color: #0066FF; }
  .energy-fuel { background: #4E5969; color: #fff; }
  .bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 0 clamp(12px, 2.2vh, 26px);
  }
  .dots { display: flex; gap: clamp(6px, 1vw, 12px); }
  .dot {
    width: clamp(8px, 1vw, 12px);
    height: clamp(8px, 1vw, 12px);
    border-radius: 999px;
    background: #D8DEE9;
    transition: all .3s ease;
    cursor: pointer;
  }
  .dot.active { width: clamp(22px, 2.6vw, 36px); background: #0066FF; }
  .progress {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 4px;
    background: rgba(0, 102, 255, .08);
  }
  .progress-fill { height: 100%; width: 0; background: #0066FF; }
  .progress-fill.run { animation: fill var(--slide-ms, 5000ms) linear forwards; }
  @keyframes fill { from { width: 0 } to { width: 100% } }
  .state-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #86909C; font-size: 16px;
  }

  /* 横屏（OBS 横屏挂屏）：图左、文右 */
  @media (orientation: landscape) {
    .card {
      flex-direction: row;
      align-items: center;
      gap: clamp(16px, 3vw, 56px);
    }
    .media { flex: 1 1 58%; }
    .info {
      flex: 1 1 42%;
      align-items: flex-start;
      text-align: left;
      gap: clamp(10px, 2.2vh, 22px);
    }
    .model { font-size: clamp(34px, 4vw, 88px); }
    .brand-logo { height: clamp(32px, 4.4vw, 68px); }
    .badges { justify-content: flex-start; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">奥雪致行 · 每日车型精选</div>
    <div class="topbar-date" id="topDate"></div>
  </div>
  <main class="stage" id="stage"><div class="state-msg">加载中…</div></main>
  <div class="bottom"><div class="dots" id="dots"></div></div>
  <div class="progress"><div class="progress-fill" id="progress"></div></div>

<script>
(function () {
  'use strict';
  var SLIDE_MS = 5000;
  var DAILY_N = 5;

  function dayIndex() {
    var now = new Date();
    var start = Date.UTC(2026, 0, 1);
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - start) / 86400000);
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 按品牌轮转排队（同品牌最多 3 个出现在同一天），再按天数滑窗取 5 个：
  // 同一天内容固定、每天自动换一批、约 18 天滚完全部车型、跨天基本不重复
  function pickDaily(trucks, n) {
    var d = dayIndex();
    var byBrand = {};
    var order = [];
    trucks.forEach(function (t) {
      var b = t.brand || '';
      if (!byBrand[b]) { byBrand[b] = []; order.push(b); }
      byBrand[b].push(t);
    });
    var deal = [];
    var max = 0;
    order.forEach(function (b) { max = Math.max(max, byBrand[b].length); });
    for (var r = 0; r < max; r++) {
      order.forEach(function (b) { if (byBrand[b][r]) deal.push(byBrand[b][r]); });
    }
    var count = Math.min(n, deal.length);
    var start = ((d * n) % deal.length + deal.length) % deal.length;
    var out = [];
    for (var k = 0; k < count; k++) out.push(deal[(start + k) % deal.length]);
    // 当日顺序做确定性洗牌，避免观看顺序呆板（只改顺序，不改成员）
    var rnd = mulberry32((d * 2654435761) % 2147483647 + 1);
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    return out;
  }

  var ENERGY_ICONS = {
    '纯电': '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
    '油车': '<svg viewBox="0 0 24 24"><path d="M12 2s6.5 7 6.5 11.5a6.5 6.5 0 1 1-13 0C5.5 9 12 2 12 2z"/></svg>'
  };

  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var stage = document.getElementById('stage');
  var dotsBox = document.getElementById('dots');
  var progress = document.getElementById('progress');
  var slides = [], dots = [], cur = 0, timer = null, paused = false;

  function show(i) {
    cur = i;
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    dots.forEach(function (d, k) { d.classList.toggle('active', k === i); });
    progress.classList.remove('run');
    void progress.offsetWidth;
    clearTimeout(timer);
    if (paused) { document.body.classList.add('paused'); return; }
    document.body.classList.remove('paused');
    progress.classList.add('run');
    timer = setTimeout(function () { show((cur + 1) % slides.length); }, SLIDE_MS);
  }

  // 点图片暂停 / 再点继续：暂停时冻结进度条并显示提示
  function togglePause() {
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      document.body.classList.add('paused');
    } else {
      show(cur);
    }
  }

  function build(list) {
    stage.innerHTML = '';
    dotsBox.innerHTML = '';
    slides = []; dots = [];
    document.documentElement.style.setProperty('--slide-ms', SLIDE_MS + 'ms');

    list.forEach(function (t, i) {
      var img = (t.gallery && t.gallery[0]) || t.image || '';
      var brand = t.brand || '';
      var name = String(t.name || '');
      var model = brand && name.indexOf(brand) === 0 ? name.slice(brand.length).trim() : name;
      var energy = t.energy || '';
      var evCls = energy === '纯电' ? 'energy-ev' : 'energy-fuel';
      var icon = ENERGY_ICONS[energy] || '';
      var type = t.truckType || '';

      var slide = el(
        '<section class="slide' + (i === 0 ? ' active' : '') + '">' +
          '<div class="card">' +
            '<div class="media">' + (img ? '<img src="' + esc(img) + '" alt="' + esc(name) + '" />' : '') + '</div>' +
            '<div class="info">' +
              '<div class="brand-row">' +
                (t.brandId ? '<img class="brand-logo" src="data/images/brand-' + esc(t.brandId) + '.webp" alt="" onerror="this.style.display=\'none\'" />' : '') +
                '<span class="brand-name">' + esc(brand) + '</span>' +
              '</div>' +
              '<h1 class="model">' + esc(model) + '</h1>' +
              '<div class="badges">' +
                (energy ? '<div class="energy ' + evCls + '">' + icon + esc(energy) + '</div>' : '') +
                (type ? '<div class="chip">' + esc(type) + '</div>' : '') +
              '</div>' +
            '</div>' +
            '<div class="pause-hint">' +
              '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>已暂停 · 点击图片继续' +
            '</div>' +
          '</div>' +
        '</section>'
      );
      slide.querySelector('.media').addEventListener('click', togglePause);
      stage.appendChild(slide);
      slides.push(slide);

      var dot = el('<div class="dot' + (i === 0 ? ' active' : '') + '"></div>');
      dot.addEventListener('click', function () { show(i); });
      dotsBox.appendChild(dot);
      dots.push(dot);
    });
  }

  function todayText() {
    var now = new Date();
    var wd = '日一二三四五六'.charAt(now.getDay());
    var full = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · 星期' + wd;
    var short = (now.getMonth() + 1) + '月' + now.getDate() + '日 周' + wd;
    document.getElementById('topDate').innerHTML =
      '<span class="date-full">' + full + '</span><span class="date-short">' + short + '</span>';
  }

  async function main() {
    todayText();
    try {
      var vRes = await fetch('data/version.json?t=' + Date.now(), { cache: 'no-store' });
      var vj = await vRes.json();
      var v = vj.v || 0;
      var res = await fetch('data/data.json?v=' + v, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var trucks = (data.trucks || []).filter(function (t) { return t && t.name; });
      if (!trucks.length) throw new Error('空数据');
      build(pickDaily(trucks, DAILY_N));
      show(0);
    } catch (e) {
      stage.innerHTML = '<div class="state-msg">数据加载失败，请刷新页面重试</div>';
      console.error('[live] 加载失败:', e);
    }
  }
  main();
})();
</script>
</body>
</html>
